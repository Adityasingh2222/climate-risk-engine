# model_params.yaml
# ---------------------------------------------------------------------
# EDIT THIS FILE to change the model's financial assumptions without
# touching Python code.
# ---------------------------------------------------------------------

valuation:
  wacc: 0.08                 # discount rate used to present-value future carbon costs
  tax_rate: 0.21              # applied as a tax shield on carbon costs (deductible opex)
  default_valuation_year: 2025
  default_horizon_year: 2050

risk_defaults:
  pass_through_rate: 0.0      # fraction of carbon cost passed to customers via pricing
  abatement_rate: 0.0         # fraction of emissions already avoided vs. sector baseline

market_data:
  market_ticker: "SPY"        # broad market proxy for the carbon-beta regression
  carbon_ticker: "KRBN"       # real traded carbon-allowance ETF

clustering:
  default_n_clusters: 3
  default_method: "kmeans"    # "kmeans" or "agglomerative"
