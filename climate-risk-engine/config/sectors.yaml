# sectors.yaml
# ---------------------------------------------------------------------
# EDIT THIS FILE to change the model's carbon intensity assumptions
# without touching any Python code. Save the file and re-run the app —
# changes are picked up automatically on the next run.
#
# intensity: tons of CO2-equivalent emitted per $1,000,000 of revenue
#   (direct operations: Scope 1 + Scope 2 only)
# scope3_multiplier: multiply "intensity" by this to get a full
#   lifecycle estimate including supply chain / value chain (Scope 3)
#   emissions. See README.md for why this matters (e.g. tech companies
#   have low direct emissions but large supply-chain footprints).
# note: shown in the dashboard to explain what drives that sector's number
#
# Sources to replace these illustrative figures with real data:
#   - CDP (cdp.net) - company-disclosed emissions
#   - EPA Greenhouse Gas Reporting Program (ghgdata.epa.gov)
#   - Company 10-K / sustainability reports
# ---------------------------------------------------------------------

sectors:
  Energy:
    intensity: 850.0
    scope3_multiplier: 1.3
    note: "Direct fuel combustion and extraction (Scope 1 dominant)."

  Utilities:
    intensity: 950.0
    scope3_multiplier: 1.1
    note: "Fossil-fuel power generation; varies hugely by fuel mix."

  Basic Materials:
    intensity: 620.0
    scope3_multiplier: 1.4
    note: "Energy-intensive processing (smelting, cement kilns, cracking)."

  Industrials:
    intensity: 210.0
    scope3_multiplier: 2.5
    note: "Mixed - heavy manufacturing higher, services-heavy industrials lower."

  Consumer Cyclical:
    intensity: 90.0
    scope3_multiplier: 4.0
    note: "Mostly Scope 3 (supply chain) heavy, Scope 1/2 moderate."

  Consumer Defensive:
    intensity: 110.0
    scope3_multiplier: 3.0
    note: "Agriculture and packaging-driven emissions."

  Real Estate:
    intensity: 60.0
    scope3_multiplier: 1.8
    note: "Building energy use (heating, cooling, electricity)."

  Financial Services:
    intensity: 8.0
    scope3_multiplier: 15.0
    note: "Low direct emissions; financed emissions (Scope 3) dominate for banks/insurers."

  Healthcare:
    intensity: 45.0
    scope3_multiplier: 3.5
    note: "Manufacturing and logistics driven."

  Technology:
    intensity: 15.0
    scope3_multiplier: 8.0
    note: "Low Scope 1/2; supply chain + device use dwarf direct operations."

  Communication Services:
    intensity: 20.0
    scope3_multiplier: 3.0
    note: "Network infrastructure and data centers."

  Unknown:
    intensity: 150.0
    scope3_multiplier: 2.0
    note: "No sector match found - using cross-sector average."
